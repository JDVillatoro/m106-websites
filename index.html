<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Graph Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Graph Generator</h1>
        <form id="graph-form">
            <label for="vertices">Number of vertices:</label>
            <input type="number" id="vertices" name="vertices" min="1" value="5" required>
            <br>
            <input type="checkbox" id="loop" name="loop">
            <label for="loop">Allow loops (loop graph)</label>
            <br>
            <input type="checkbox" id="multigraph" name="multigraph">
            <label for="multigraph">Allow multiedges (multigraph)</label>
            <br>
            <label for="components">Number of connected components:</label>
            <input type="number" id="components" name="components" min="1" value="1" required>
            <br>
            <button type="submit">Generate Graph</button>
        </form>
        <div id="csv-output">
            <!-- CSV will be displayed here -->
        </div>
    </div>
    <script src="graph.js"></script>
    <script src="script.js"></script>
</body>
</html>
